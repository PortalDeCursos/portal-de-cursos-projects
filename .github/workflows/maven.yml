name: PR Workflow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        # OBS: -DskipTests pula a fase de testes do ciclo do Maven durante o build.
        # Quando os testes forem implementados, remover a flag -DskipTests da linha abaixo
        # e voltar para a linha original comentada logo em seguida.
        run: mvn -B package --file pom.xml -DskipTests
        # run: mvn -B package --file pom.xml

      # - name: Run tests
      #   run: mvn test
