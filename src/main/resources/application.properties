spring.application.name=portaltads.projects
spring.config.import=optional:file:.env[.properties]

server.servlet.context-path=/api/projetos/

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.port=${SERVER_PORT:8083}

# Comunicacaoo com outros microsservicos
servico-usuarios.url=${SERVICO_USUARIOS_URL:http://localhost:8081/api/usuarios}
servico-cursos.url=${SERVICO_CURSOS_URL:http://localhost:8082/api/academico}

# Armazenamento de documentos
app.storage.diretorio=${APP_STORAGE_DIR:portalcursos/projetos}

# Limite de tamanho para upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Mensageria CloudAMQP
spring.rabbitmq.addresses=${RABBITMQ_URL}